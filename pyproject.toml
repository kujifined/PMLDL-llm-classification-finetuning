[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmldl-llm-preference"
version = "0.1.0"
description = "Reproducible experiments for Kaggle LLM Classification Finetuning"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
transformer = [
  "accelerate>=0.33,<2",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.43,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
